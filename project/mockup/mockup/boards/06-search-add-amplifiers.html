body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

<div style="min-height: 900px; box-sizing: border-box; background: #11111b; color: #cdd6f4; font-family: 'IBM Plex Mono', ui-monospace, monospace; padding: 28px 40px 40px; display: flex; flex-direction: column; gap: 20px">

  <header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px 32px; min-height: 60px">
    <div style="display: flex; flex-direction: column; gap: 2px; width: max-content">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1">Lab.Rack</h1>
      <div aria-label="DSP CONTROLLER" style="width: 0; min-width: 100%; display: flex; justify-content: space-between; font-family: 'Barlow Condensed', sans-serif; font-weight: 500; font-size: 21px; line-height: 1; color: #a6adc8"><span>D</span><span>S</span><span>P</span><span style="flex: 0 0 0.5em"></span><span>C</span><span>O</span><span>N</span><span>T</span><span>R</span><span>O</span><span>L</span><span>L</span><span>E</span><span>R</span></div>
    </div>
    <nav style="display: flex; gap: 8px">
      <a class="tab" href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 20px; box-sizing: border-box; background: #313244; color: #cdd6f4; border: 1px solid #585b70; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">Amplifiers</a>
      <a class="tab" href="A-Mix.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 20px; box-sizing: border-box; background: #313244; color: #cdd6f4; border: 1px solid #585b70; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">Mix &amp; EQ</a>
      <a class="tab" href="A-Search.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 20px; box-sizing: border-box; background: #b4befe; color: #11111b; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">Search</a>
    </nav>
    <button sc-camel-on-click="{{toggleAll}}" aria-pressed="{{allMuted}}" style="justify-self: end; min-height: 52px; padding: 0 28px; border-radius: 4px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; {{allSty}}">{{allLabel}}</button>
  </header>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start">

    <section style="display: flex; flex-direction: column; gap: 12px; background: #1e1e2e; border: 1px solid #45475a; border-radius: 6px; padding: 18px">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #a6adc8">SEARCH THE NETWORK FOR</span>
      <sc-for list="{{protos}}" as="p" hint-placeholder-count="2">
        <button sc-camel-on-click="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px 0 14px; border-radius: 4px; text-align: left; {{p.sty}}">
          <span aria-hidden="true" style="position: relative; flex: 0 0 auto; width: 36px; height: 20px; border-radius: 10px; background: {{p.trk}}"><span style="position: absolute; top: 2px; left: {{p.knob}}; width: 16px; height: 16px; border-radius: 50%; background: {{p.knobC}}; transition: left 0.12s linear"></span></span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em">{{p.name}}</span><span style="font-size: 11px; font-weight: 400">{{p.status}}</span></span>
        </button>
      </sc-for>
      <button sc-camel-on-click="{{scan}}" aria-disabled="{{scanOff}}" style="min-height: 48px; padding: 0 18px; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; {{scanSty}}">{{scanTxt}}</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px; background: #1e1e2e; border: 1px solid #45475a; border-radius: 6px; padding: 18px">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #a6adc8">ADD AN AMPLIFIER MANUALLY</span>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; letter-spacing: 0.12em; color: #a6adc8">NAME
        <input type="text" autocomplete="off" value="{{fName}}" sc-camel-on-change="{{setName}}" aria-label="Amplifier name" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #181825; color: #cdd6f4; border: 1px solid #585b70; font-family: inherit; font-size: 13px; font-weight: 600"></label>
      <div style="display: flex; gap: 12px; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; letter-spacing: 0.12em; color: #a6adc8">PROTOCOL
          <div style="display: flex; gap: 6px">
            <sc-for list="{{fprotos}}" as="fp" hint-placeholder-count="2"><button sc-camel-on-click="{{fp.pick}}" aria-pressed="{{fp.on}}" style="min-width: 76px; min-height: 44px; border-radius: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; {{fp.sty}}">{{fp.txt}}</button></sc-for>
          </div>
        </div>
        <label style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 10px; letter-spacing: 0.12em; color: #a6adc8">IP ADDRESS
          <input type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.1.50" value="{{fIp}}" sc-camel-on-change="{{setFIp}}" aria-label="Amplifier IP address" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #181825; color: #cdd6f4; border: 1px solid #585b70; font-family: inherit; font-size: 13px; font-weight: 600"></label>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button sc-camel-on-click="{{addAmp}}" style="min-height: 48px; padding: 0 22px; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; background: #b4befe; color: #11111b; border: 1px solid #b4befe">ADD AMP</button>
        <span role="alert" style="flex: 1 1 0; min-width: 0; font-size: 12px; color: #eba0ac">{{fErr}}</span>
      </div>
    </section>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px; background: #1e1e2e; border: 1px solid #45475a; border-radius: 6px; padding: 18px">
    <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #a6adc8">KNOWN AMPLIFIERS</span>
    <sc-if value="{{noAmps}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 20px; text-align: center; font-size: 13px; color: #a6adc8; border: 1px dashed #585b70; border-radius: 6px">No amplifier yet. Turn on a search, or add one manually.</div>
    </sc-if>
    <sc-for list="{{amps}}" as="amp" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 16px; min-height: 52px; background: #181825; border: 1px solid #45475a; border-radius: 4px; padding: 0 12px 0 16px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 28px; line-height: 1; color: #b4befe; width: 34px">{{amp.idx}}</span>
        <input type="text" autocomplete="off" value="{{amp.name}}" sc-camel-on-change="{{amp.rename}}" aria-label="Name of amplifier {{amp.idx}}" style="flex: 1 1 0; min-width: 0; height: 36px; box-sizing: border-box; padding: 0 10px; border-radius: 4px; background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; font-family: inherit; font-size: 14px; font-weight: 600">
        <span style="flex: 0 0 auto; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; {{amp.protoSty}}">{{amp.proto}}</span>
        <span style="flex: 0 0 130px; font-size: 12px; font-weight: 600">{{amp.ip}}</span>
        <span style="flex: 0 0 64px; font-size: 10px; letter-spacing: 0.1em; color: #a6adc8">{{amp.src}}</span>
        <button sc-camel-on-click="{{amp.remove}}" aria-label="Remove {{amp.name}}" style="flex: 0 0 auto; min-height: 36px; padding: 0 14px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; background: transparent; color: #a6adc8; border: 1px solid #585b70">REMOVE</button>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = {
    t: 0,
    amps: [
      { name: 'FOH Main L', proto: 'IPD', ip: '192.168.1.21', src: 'AUTO' },
      { name: 'FOH Main R', proto: 'IPD', ip: '192.168.1.22', src: 'AUTO' },
      { name: 'Subs', proto: 'IPX', ip: '192.168.1.31', src: 'AUTO' }
    ],
    useIPD: true, useIPX: true, scanUntil: 0, scanMsg: '',
    allMuted: false, arm: '', armT: 0,
    fName: '', fProto: 'IPD', fIp: '', fErr: ''
  };
  pool = [
    { name: 'Front fill', proto: 'IPX', ip: '192.168.1.32' },
    { name: 'Delays', proto: 'IPD', ip: '192.168.1.23' },
    { name: 'Monitors', proto: 'IPX', ip: '192.168.1.33' }
  ];
  ipOk(v) { return /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(String(v).trim()); }
  componentDidMount() {
    this.iv = setInterval(() => {
      if (this.props.live === false) return;
      const t = this.state.t + 0.1;
      if (this.state.scanUntil && t >= this.state.scanUntil) this.finishScan(t);
      else this.setState({ t });
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  enabled(p) { return p === 'IPD' ? this.state.useIPD : this.state.useIPX; }
  finishScan(t) {
    const S = this.state, have = new Set(S.amps.map((x) => x.ip));
    const found = this.pool.filter((p) => this.enabled(p.proto) && !have.has(p.ip));
    this.setState({
      t, amps: S.amps.concat(found.map((p) => ({ ...p, src: 'AUTO' }))), scanUntil: 0,
      scanMsg: found.length ? 'Found ' + found.length + ' new: ' + found.map((p) => p.name).join(', ') : 'No new amplifier found'
    });
  }
  toggleProto(p) {
    const key = p === 'IPD' ? 'useIPD' : 'useIPX', on = !this.state[key];
    this.setState({ [key]: on, scanMsg: on ? '' : p + ' search is off', scanUntil: on ? this.state.t + 2 : this.state.scanUntil });
  }
  addAmp() {
    const S = this.state, ip = S.fIp.trim(), name = S.fName.trim() || 'Amp ' + (S.amps.length + 1);
    if (!this.ipOk(ip)) { this.setState({ fErr: 'Enter a valid IPv4 address, for example 192.168.1.50' }); return; }
    if (S.amps.some((x) => x.ip === ip)) { this.setState({ fErr: 'An amplifier with this IP is already in the list' }); return; }
    this.setState({ amps: S.amps.concat([{ name, proto: S.fProto, ip, src: 'MANUAL' }]), fName: '', fIp: '', fErr: '', scanMsg: name + ' added manually' });
  }
  renameAmp(i, v) {
    const name = v.trim();
    if (!name) { this.setState({ amps: this.state.amps.slice() }); return; }
    this.setState({ amps: this.state.amps.map((x, k) => (k === i ? { ...x, name } : x)), scanMsg: 'Renamed to ' + name });
  }
  removeAmp(i) {
    const S = this.state;
    this.setState({ amps: S.amps.filter((_, k) => k !== i), scanMsg: S.amps[i].name + ' removed' });
  }
  armed(k) { return this.state.arm === k && this.state.t - this.state.armT < 3; }
  toggleAll() {
    const S = this.state;
    if (S.allMuted && !this.armed('all')) { this.setState({ arm: 'all', armT: S.t }); return; }
    this.setState({ allMuted: !S.allMuted, arm: '' });
  }
  renderVals() {
    const S = this.state;
    const offSty = 'background: #313244; color: #cdd6f4; border: 1px solid #585b70';
    const scanning = S.scanUntil > 0, none = !S.useIPD && !S.useIPX;
    const count = (p) => S.amps.filter((x) => x.proto === p).length;
    const protos = ['IPD', 'IPX'].map((p) => {
      const on = this.enabled(p), n = count(p);
      return {
        name: p + ' amplifiers', on,
        status: on ? (scanning ? 'Scanning the network…' : 'Searching · ' + n + ' found') : 'Off · not searching · ' + n + ' listed',
        aria: (on ? 'Stop searching for ' : 'Search for ') + p + ' amplifiers',
        sty: on ? 'background: rgba(180, 190, 254, 0.12); color: #cdd6f4; border: 1px solid #b4befe' : 'background: #181825; color: #a6adc8; border: 1px solid #585b70',
        trk: on ? '#b4befe' : '#585b70', knob: on ? '18px' : '2px', knobC: on ? '#11111b' : '#cdd6f4',
        toggle: () => this.toggleProto(p)
      };
    });
    const allSty = S.allMuted ? 'background: #11111b; color: #eba0ac; border: 2px solid #eba0ac' : 'background: #b4befe; color: #11111b; border: 2px solid #b4befe';
    return {
      allMuted: S.allMuted,
      allLabel: S.allMuted ? (this.armed('all') ? 'CONFIRM UNMUTE ALL' : 'UNMUTE ALL') : 'MUTE ALL',
      allSty,
      toggleAll: () => this.toggleAll(),
      summary: S.amps.length + ' amplifier' + (S.amps.length === 1 ? '' : 's') + (S.scanMsg ? ' · ' + S.scanMsg : ''),
      protos, scanOff: none, scanTxt: scanning ? 'SCANNING…' : 'SCAN NOW',
      scanSty: none || scanning ? 'background: #181825; color: #6c7086; border: 1px solid #45475a; cursor: default' : offSty,
      scan: () => { if (!none && !scanning) this.setState({ scanUntil: S.t + 2, scanMsg: '' }); },
      fName: S.fName, fIp: S.fIp, fErr: S.fErr,
      fprotos: ['IPD', 'IPX'].map((p) => ({ txt: p, on: S.fProto === p, sty: S.fProto === p ? 'background: #b4befe; color: #11111b; border: 1px solid #b4befe' : offSty, pick: () => this.setState({ fProto: p }) })),
      setName: (e) => this.setState({ fName: e.target.value }),
      setFIp: (e) => this.setState({ fIp: e.target.value, fErr: '' }),
      addAmp: () => this.addAmp(),
      noAmps: S.amps.length === 0,
      amps: S.amps.map((am, i) => ({
        ...am, idx: String(i + 1).padStart(2, '0'),
        protoSty: am.proto === 'IPD' ? 'background: rgba(203, 166, 247, 0.16); color: #cba6f7; border: 1px solid #cba6f7' : 'background: rgba(116, 199, 236, 0.16); color: #74c7ec; border: 1px solid #74c7ec',
        rename: (e) => this.renameAmp(i, e.target.value),
        remove: () => this.removeAmp(i)
      }))
    };
  }
}
</script>
