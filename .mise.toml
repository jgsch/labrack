# Every task runs inside the Nix dev shell (flake.nix), so only nix and mise
# are needed on the host.

[tasks.fmt]
description = "Format the code"
run = "nix develop -c cargo fmt --all -- --config max_width=110,use_small_heuristics=Max"

[tasks.lint]
description = "Format check and clippy (both drivers, each alone); warnings are errors"
run = """
nix develop -c bash -ec '
cargo fmt --all --check -- --config max_width=110,use_small_heuristics=Max
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy -p amps --all-targets --no-default-features --features ipx -- -D warnings
cargo clippy -p amps --all-targets --no-default-features --features ipd -- -D warnings
'
"""

[tasks.test]
description = "Run the test suite (Rust and the Python tests of scripts/)"
run = """
nix develop -c bash -ec '
cargo test --workspace
python3 -m unittest discover -s scripts
'
"""

[tasks.build]
description = "Build the workspace"
run = "nix develop -c cargo build --workspace"

[tasks.sim]
description = "Run the IPD simulator (extra arguments go to `labgruppen sim`)"
run = "nix develop -c cargo run -p amps --bin labgruppen -- sim"

[tasks.mockup]
description = "Screenshot every board of spec/mockup/ into target/mockup/ (extra arguments go to `mockup.py render`)"
run = "nix develop -c python3 scripts/mockup.py render"

[tasks.mockup-unpack]
description = "Replace spec/mockup/ with the contents of spec/mockup.html, fonts made local"
run = """
nix develop -c bash -ec '
python3 scripts/mockup.py unpack
python3 scripts/mockup.py fonts
'
"""

[tasks.mockup-pack]
description = "Build spec/mockup.html from spec/mockup/"
run = "nix develop -c python3 scripts/mockup.py pack"
