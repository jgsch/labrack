[package]
name = "labrack-core"
version = "0.1.0"
edition = "2024"
description = "LAB.RACK logic without a UI: amplifier list, connections, config, safety rules"
license = "MIT"
publish = false

[dependencies]
amps = { path = "../amps" }
async-trait = "0.1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "fs"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
